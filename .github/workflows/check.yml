name: Check

# Only for pull requests (and manual runs): tests plus a compile of both apps. No artifacts, no installer.
# Pushes to main do not build anything; releases are built by the Release workflow when a version tag is pushed.

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitattributes']
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Tests (Core)
        run: dotnet test tests/MultiServerView.Core.Tests -c Release

      - name: Build UI (type check + bundle)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Compile Windows app
        run: dotnet build src/MultiServerView.App -c Release

      - name: Compile Linux app
        run: dotnet build src/MultiServerView.Linux -c Release
